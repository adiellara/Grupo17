spring.application.name=FoodApp
server.port=${PORT:8080}

# SEGURIDAD Y EXPOSICIÓN DE ERRORES 
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# BASE DE DATOS 
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Reserva 3 conexiones para la app y deja 2 libres para mantenimiento o redeploys
spring.datasource.hikari.pool-name=FoodAppHikariPool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=20000
spring.datasource.hikari.max-lifetime=45000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.leak-detection-threshold=10000
spring.datasource.hikari.validation-timeout=5000

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Garantiza el cierre inmediato de conexiones en Clever Cloud 
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
