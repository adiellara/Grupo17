spring.application.name=FoodApp
server.port=8080

# === CONFIGURACIÓN BASE DE DATOS MYSQL 8 ===
spring.datasource.url=jdbc:mysql://localhost:3306/FoodFrenzy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/El_Salvador
spring.datasource.username=root
spring.datasource.password=Mysql@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === DIALECTO Y ESTRATEGIA DDL ===
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Usa 'create' SOLO una vez para regenerar tablas limpias; luego cámbialo a 'update'
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
