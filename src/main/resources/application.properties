spring.application.name=FoodApp
server.port=8080

# === CONFIGURACIÓN BASE DE DATOS MYSQL 8 (COMPATIBLE LOCAL Y RENDER) ===
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/FoodFrenzy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/El_Salvador}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Mysql@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === POOL HIKARICP OPTIMIZADO PARA LÍMITE DE 5 CONEXIONES EN LA NUBE ===
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=15000

# === DIALECTO Y ESTRATEGIA DDL ===
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
