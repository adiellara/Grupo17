<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pago con Tarjeta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>Formulario de Pago</h2>
    <form th:action="@{/procesarPago}" th:object="${tarjeta}" method="post" class="mt-4">
        <div class="mb-3">
            <label>Nombre del titular</label>
            <input type="text" th:field="*{nombreTitular}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Número de tarjeta</label>
            <input type="text" th:field="*{numero}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Fecha de expiración (MM/AA)</label>
            <input type="text" th:field="*{fechaExp}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>CVV</label>
            <input type="password" th:field="*{cvv}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Monto</label>
            <input type="number" step="0.01" th:field="*{monto}" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success">Pagar</button>
    </form>
</body>
</html>
