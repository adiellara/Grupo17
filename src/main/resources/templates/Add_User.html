<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar Nuevo Cliente - SIPAGO Admin</title>
    <link rel="icon" type="image/png" th:href="@{/Images/logo.png}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/Add_User.css}" />
</head>

<body>
    <!-- Barra superior de navegación rápida -->
    <div class="top-bar">
        <a th:href="@{/admin/services}" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Volver al Panel Admin
        </a>
        <span class="admin-badge"><i class="fa-solid fa-shield-halved"></i> Gestión de Clientes</span>
    </div>

    <main class="form-wrapper">
        <div class="form-card">
            <div class="card-header">
                <div class="icon-circle">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h2>Registrar Nuevo Cliente</h2>
                <p>Completa los datos para dar de alta un usuario en el sistema</p>
            </div>

            <form th:action="@{/addingUser}" method="post" class="sipago-form">
                <div class="form-group">
                    <label for="uname"><i class="fa-solid fa-user"></i> Nombre Completo</label>
                    <input type="text" id="uname" name="uname" placeholder="Ej. Adiel Martínez" required autofocus />
                </div>

                <div class="form-group">
                    <label for="uemail"><i class="fa-solid fa-envelope"></i> Correo Electrónico</label>
                    <input type="email" id="uemail" name="uemail" placeholder="cliente@ejemplo.com" required />
                </div>

                <div class="form-group">
                    <label for="unumber"><i class="fa-solid fa-phone"></i> Teléfono de Contacto (8 a 10 dígitos)</label>
                    <input type="tel" id="unumber" name="unumber" pattern="[0-9]{8,10}"
                           title="Ingresa entre 8 y 10 dígitos numéricos sin guiones"
                           placeholder="Ej. 78901234" required />
                </div>

                <!-- Contraseña inicial por defecto -->
                <input type="hidden" name="upassword" value="2330" />

                <div class="info-note">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>Se asignará una clave temporal por defecto (<strong>2330</strong>) para el primer ingreso del cliente.</span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-check"></i> Guardar Cliente
                    </button>
                    <a th:href="@{/admin/services}" class="btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
