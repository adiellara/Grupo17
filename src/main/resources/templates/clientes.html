<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrarse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 950px;
            display: flex;
            flex-wrap: wrap;
            overflow: hidden;
            margin: 15px;
        }
        .form-section {
            flex: 2;
            padding: 40px;
            min-width: 300px;
        }
        .info-section {
            flex: 1;
            background-color: #f8f6ff;
            padding: 40px;
            color: #4b0082;
            min-width: 250px;
        }
        h2 {
            color: #4b0082;
            margin-bottom: 5px;
        }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        label {
            font-weight: 600;
            font-size: 0.9rem;
        }
        input[type="text"], input[type="email"], input[type="password"], input[type="tel"] {
            width: 95%;
            padding: 10px;
            border: 2px solid #d4bfff;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus {
            border-color: #7b4dff;
        }
        .password-wrapper {
            position: relative;
            width: 95%;
        }
        .show-text {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #999;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
        .show-text:hover {
            text-decoration: underline;
        }
        .full {
            grid-column: span 2;
        }
        .gender-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .btn {
            background-color: #7b4dff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            flex: 1;
            min-width: 150px;
        }
        .btn:hover {
            background-color: #5b2eff;
        }
        .secondary-btn {
            background-color: #e0e0e0;
            color: #333;
            border: none;
            padding: 12px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            flex: 1;
            min-width: 150px;
        }
        .secondary-btn:hover {
            background-color: #ccc;
        }
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            grid-column: span 2;
            align-items: center;
            margin-top: 10px;
        }
        .main-button {
            width: 50%;
            max-width: 250px;
        }
        .button-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            flex-wrap: wrap;
        }
        .alert {
            grid-column: span 2;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        @media (max-width: 1024px) {
            .main-button {
                width: 60%;
            }
        }
        @media (max-width: 768px) {
            .buttons-container {
                gap: 10px;
            }
            .main-button {
                width: 100%;
            }
            .button-group {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="form-section">
        <h2>Registrarse</h2>
        <p>Estás a un paso de terminar.</p>

        <!-- ✅ Mensajes del backend -->
        <div th:if="${success}" class="alert alert-success" role="alert">
            <span th:text="${success}"></span>
        </div>

        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/registro}" th:object="${user}" method="post" onsubmit="return validarFormulario(event)">
            <div>
                <label for="nombre">Nombres</label>
                <input type="text" id="nombre" th:field="*{uname}" required>
            </div>

            <div>
                <label for="apellido">Apellidos</label>
                <input type="text" id="apellido" th:field="*{apellido}" required>
            </div>

            <div class="full">
                <label>Género</label>
                <div class="gender-group">
                    <label><input type="radio" th:field="*{genero}" value="Masculino" required> Masculino</label>
                    <label><input type="radio" th:field="*{genero}" value="Femenino"> Femenino</label>
                    <label><input type="radio" th:field="*{genero}" value="Prefiero no decirlo"> Prefiero no decirlo</label>
                </div>
            </div>

            <div>
                <label for="telefono">Teléfono celular</label>
                <input type="tel" id="telefono" th:field="*{unumber}" pattern="[0-9]{8,}" placeholder="Ej: 71234567" required>
            </div>

            <div class="full">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" th:field="*{uemail}" required>
            </div>

            <div>
                <label for="password">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="password" th:field="*{upassword}" required>
                    <button type="button" class="show-text" onclick="togglePassword('password', this)">MOSTRAR</button>
                </div>
            </div>

            <div>
                <label for="confirmPassword">Confirma tu contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" required>
                    <button type="button" class="show-text" onclick="togglePassword('confirmPassword', this)">MOSTRAR</button>
                </div>
            </div>

            <div id="errorMsg" class="error"></div>

            <div class="buttons-container">
                <button type="submit" class="btn main-button">Crear cuenta</button>
                <div class="button-group">
                    <button type="button" class="secondary-btn" onclick="resetForm()">Limpiar</button>
                    <button type="button" class="secondary-btn" onclick="volverLogin()">Volver al login</button>
                </div>
            </div>
        </form>
    </div>

    <div class="info-section">
        <h3>Con tu cuenta puedes</h3>
        <p>🕓 Tener acceso fácil y rápido a tu historial de órdenes.</p>
        <p>📍 Rastrear tu orden en tiempo real.</p>
        <p>🎁 Disfrutar de promociones exclusivas para usuarios registrados.</p>
    </div>
</div>

<script>
    function togglePassword(id, btn) {
        const input = document.getElementById(id);
        if (input.type === "password") {
            input.type = "text";
            btn.textContent = "OCULTAR";
        } else {
            input.type = "password";
            btn.textContent = "MOSTRAR";
        }
    }

    function validarFormulario(event) {
        const pass = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        const errorMsg = document.getElementById('errorMsg');

        errorMsg.textContent = '';

        if (pass !== confirm) {
            errorMsg.textContent = "Las contraseñas no coinciden.";
            event.preventDefault();
            return false;
        }
        return true; // permite envío real al backend
    }

    function resetForm() {
        document.querySelector("form").reset();
        document.getElementById('errorMsg').textContent = '';
    }

    function volverLogin() {
        // ✅ redirige correctamente al formulario de login
        window.location.href = "/login";
    }
</script>
</body>
</html>
