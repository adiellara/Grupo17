<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Operativo - SIPAGO</title>
    <link rel="icon" type="image/png" th:href="@{/Images/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/AdminLogin.css}">
</head>
<body>
    <!-- Botón flotante para volver al Inicio -->
    <a th:href="@{/home}" class="back-home-btn">
        <i class="fa-solid fa-arrow-left me-2"></i> Volver al Inicio
    </a>

    <div class="admin-login-wrapper">
        <div class="admin-login-card">
            <!-- Encabezado con Logo y Distintivo de Seguridad -->
            <div class="text-center mb-4">
                <div class="admin-shield-circle mx-auto mb-3">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <span class="security-tag d-inline-block mb-1">
                    <i class="fa-solid fa-lock me-1"></i> Zona Operativa • SIPAGO
                </span>
                <h2 class="fw-bold text-white mb-1">Acceso Operativo</h2>
                <p class="text-muted-light small mb-0">
                    Portal exclusivo para <span class="text-emerald fw-semibold">Administrador, Gerente, Cajero y Cocinero</span>
                </p>
            </div>

            <!-- Pestañas rápidas de cambio de perfil (Cliente / Acceso Operativo) -->
            <div class="role-switcher mb-4">
                <a th:href="@{/login}" class="role-tab">
                    <i class="fa-solid fa-user me-1"></i> Portal Clientes
                </a>
                <span class="role-tab active">
                    <i class="fa-solid fa-id-badge me-1"></i> Acceso Operativo
                </span>
            </div>

            <!-- Mensajes de error o cierre de sesión -->
            <div th:if="${error}" class="alert alert-danger d-flex align-items-center py-2 px-3 small mb-3" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i>
                <span th:text="${error}"></span>
            </div>

            <div th:if="${success}" class="alert alert-success d-flex align-items-center py-2 px-3 small mb-3" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i>
                <span th:text="${success}"></span>
            </div>

            <!-- Formulario de inicio de sesión operativo -->
            <form th:action="@{/adminLogin}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label text-light small fw-medium">Correo corporativo</label>
                    <div class="input-group sipago-admin-input">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="email" name="email" class="form-control"
                               placeholder="operador@sipago.com" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-light small fw-medium">Contraseña</label>
                    <div class="input-group sipago-admin-input">
                        <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                        <input type="password" id="password" name="password" class="form-control"
                               placeholder="••••••••" required>
                        <button type="button" class="btn-toggle-pass" onclick="toggleAdminPassword()" title="Mostrar/Ocultar contraseña">
                            <i id="toggleAdminIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-emerald-submit py-2 fw-bold">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Ingresar al Panel Operativo
                    </button>
                </div>
            </form>

            <footer class="admin-login-footer mt-4 pt-3 text-center">
                <p class="mb-0"><i class="fa-solid fa-shield-check text-emerald me-1"></i> Acceso monitoreado (RBAC) • © 2026 SIPAGO FoodApp</p>
            </footer>
        </div>
    </div>

    <script>
        function toggleAdminPassword() {
            const input = document.getElementById("password");
            const icon = document.getElementById("toggleAdminIcon");
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
    </script>
</body>
</html>
