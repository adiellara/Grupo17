<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SIPAGO</title>
    <link rel="icon" type="image/png" th:href="@{/Images/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/Login.css}">
</head>
<body>
    <!-- Botón flotante para volver al Inicio -->
    <a th:href="@{/home}" class="back-home-btn">
        <i class="fa-solid fa-arrow-left me-2"></i> Volver al Inicio
    </a>

    <div class="login-wrapper">
        <div class="login-card">
            <!-- Encabezado con Logo y Marca -->
            <div class="text-center mb-4">
                <img th:src="@{/Images/logo.png}" onerror="this.src='/images/logo.png'" alt="Logo SIPAGO" class="login-logo mb-2">
                <span class="brand-tag d-block mb-1">SIPAGO • FoodApp</span>
                <h2 class="fw-bold text-white mb-1">Inicio de Sesión</h2>
                <p class="text-muted-light small mb-0">Ingresa tus credenciales para realizar y rastrear pedidos</p>
            </div>

            <!-- Pestañas rápidas de cambio de perfil (Cliente / Admin) -->
            <div class="role-switcher mb-4">
                <span class="role-tab active">
                    <i class="fa-solid fa-user me-1"></i> Portal Clientes
                </span>
                <a th:href="@{/admin}" class="role-tab">
                    <i class="fa-solid fa-shield-halved me-1"></i> Portal Admin
                </a>
            </div>

            <!-- Mensaje de éxito (registro exitoso) -->
            <div th:if="${success}" class="alert alert-success d-flex align-items-center py-2 px-3 small" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i>
                <span th:text="${success}"></span>
            </div>

            <!-- Mensaje de error (login fallido) -->
            <div th:if="${error}" class="alert alert-danger d-flex align-items-center py-2 px-3 small" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i>
                <span th:text="${error}"></span>
            </div>

            <!-- Formulario de inicio de sesión -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label text-light small fw-medium">Correo electrónico</label>
                    <div class="input-group sipago-input-group">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="email" name="email" class="form-control"
                               placeholder="usuario@ejemplo.com" required autofocus>
                    </div>
                </div>

                <div class="mb-2">
                    <label for="password" class="form-label text-light small fw-medium">Contraseña</label>
                    <div class="input-group sipago-input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="password" name="password" class="form-control"
                               placeholder="••••••••" required>
                        <button type="button" class="btn-toggle-pass" onclick="togglePassword()" title="Mostrar/Ocultar contraseña">
                            <i id="toggleIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="text-end mb-4">
                    <a th:href="@{/forgot-password}" class="link-gold small">¿Olvidaste tu contraseña?</a>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-gold-submit py-2 fw-bold">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Iniciar Sesión
                    </button>

                    <div class="divider-text my-2"><span>¿No tienes cuenta?</span></div>

                    <a th:href="@{/clientes/registro}" class="btn btn-outline-gold py-2 fw-semibold">
                        <i class="fa-solid fa-user-plus me-2"></i> Crear Cuenta Nueva
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById("password");
            const icon = document.getElementById("toggleIcon");
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
    </script>
</body>
</html>
