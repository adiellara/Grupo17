<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<title>Actualizar producto</title>
	<link rel="stylesheet" href="" th:href="@{/css/Update_Product.css}" />
</head>

<body>
    <a href="/admin/products">Regresar</a>
    
	<div class="updateProduct">
		<h3 style="font-weight: bolder;color: seagreen;">Actualizar producto existente:</h3>
		
		<form action="" th:action="@{'/updatingProduct/'+${product.pid}}" th:object="${product}">
			
            <div>
                ID Producto: 
                <span class="product-info" th:text="${product.pid}"></span>
                <input type="hidden" name="pid" th:value="${product.pid}" />
            </div>
            
            <div>Nombre del producto:</div>
			<input type="text" name="pname" th:value="${product.pname}" /> 
            
            <div>Precio del producto:</div>
			<input type="text" name="pprice" th:value="${product.pprice}" />
            
            <div>Descripción del producto:</div> 
			<textarea name="pdescription" id="" cols="10" rows="1" th:text="${product.pdescription}"></textarea>
            
			<button type="submit">Actualizar producto</button>

		</form>
	</div>
</body>

</html>
