<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<title>Añadir producto nuevo</title>
	<link rel="stylesheet" href="" th:href="@{/css/Add_Product.css}" />
</head>
<body>
    <a href="/admin/products" class="regresar-btn">Regresar</a>
    <div class="addProducts"> <h3 style="font-weight: bolder;color: seagreen;">Añadir un nuevo producto:</h3>
        
        <form action="" th:action="@{/addingProduct}" method="post">
            Nombre del producto:
            <input type="text" name="pname" value="" placeholder="" /> <br />
            Precio del producto:
            <input type="text" name="pprice" placeholder="" /><br />
            Descripción del producto: <br />
            <textarea name="pdescription" id="" cols="15" rows="1"
                      placeholder=""></textarea><br />
            <button type="submit">Añadir producto</button>
        </form>
    </div> 
</body>
</html>
