<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Pago con Tarjeta</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Bootstrap 5.3.3 (última versión estable) -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- FontAwesome para íconos -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

        <style>
            body {
                background: linear-gradient(135deg, #f8f9fa, #e9ecef);
                font-family: 'Segoe UI', Roboto, sans-serif;
            }
            .card-form {
                max-width: 480px;
                margin: 80px auto;
                background: #fff;
                border-radius: 16px;
                box-shadow: 0 6px 18px rgba(0,0,0,0.1);
                padding: 35px;
            }
            .card-form h3 {
                color: #0d6efd;
                font-weight: 600;
            }
            .form-control:focus {
                border-color: #0d6efd;
                box-shadow: 0 0 6px rgba(13,110,253,0.3);
            }
            .btn-primary {
                width: 100%;
                font-weight: 600;
                padding: 10px;
                transition: all 0.3s ease;
            }
            .btn-primary:hover {
                background-color: #0b5ed7;
                transform: scale(1.02);
            }
            .card-icons {
                display: flex;
                justify-content: center;
                gap: 15px;
                font-size: 2rem;
                margin-bottom: 20px;
            }
            .card-icons i {
                color: #495057;
            }
            .alert {
                border-radius: 10px;
            }
        </style>
    </head>
    <body>

        <div class="card-form">
            <div class="text-center mb-3">
                <div class="card-icons">
                    <i class="fa-brands fa-cc-visa text-primary"></i>
                    <i class="fa-brands fa-cc-mastercard text-danger"></i>
                </div>
                <h3>Pago con Tarjeta</h3>
                <p class="text-muted">Ingrese los datos de su tarjeta para completar el pago.</p>
            </div>

            <form th:action="@{/pago}" th:object="${pago}" method="post">

                <div class="mb-3">
                    <label class="form-label">Nombre del Titular</label>
                    <input type="text" th:field="*{nombreTitular}" class="form-control" placeholder="Ej. Juan Pérez" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('nombreTitular')}" th:errors="*{nombreTitular}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Número de Tarjeta</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-regular fa-credit-card"></i></span>
                        <input type="text" th:field="*{numeroTarjeta}" class="form-control" placeholder="1111 2222 3333 4444" required>
                    </div>
                    <div class="text-danger" th:if="${#fields.hasErrors('numeroTarjeta')}" th:errors="*{numeroTarjeta}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Expiración (MM/AA)</label>
                        <input type="text" th:field="*{fechaExpiracion}" class="form-control" placeholder="12/26" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('fechaExpiracion')}" th:errors="*{fechaExpiracion}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">CVV</label>
                        <input type="password" th:field="*{cvv}" class="form-control" placeholder="123" maxlength="4" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('cvv')}" th:errors="*{cvv}"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Monto</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" step="0.01" th:field="*{monto}" class="form-control" placeholder="Ej. 99.99" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-lock me-2"></i> Pagar de forma segura
                </button>

                <div th:if="${mensaje}" class="alert alert-success mt-4 text-center" th:text="${mensaje}"></div>
            </form>
        </div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
