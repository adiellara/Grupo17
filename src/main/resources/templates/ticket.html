<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ticket de Compra</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="card p-4">
        <h2 class="text-center mb-4">Ticket de Compra</h2>
        <p><strong>Código:</strong> <span th:text="${ticket.codigo}"></span></p>
        <p><strong>Titular:</strong> <span th:text="${ticket.titular}"></span></p>
        <p><strong>Monto:</strong> $<span th:text="${ticket.monto}"></span></p>
        <p><strong>Fecha:</strong> <span th:text="${#temporals.format(ticket.fecha, 'dd/MM/yyyy HH:mm')}"></span></p>
        <a href="/pago" class="btn btn-primary mt-3">Volver</a>
    </div>
</body>
</html>
