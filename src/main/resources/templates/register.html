<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Crear cuenta | FoodApp</title>
	<link rel="icon" type="image/x-icon" href="./img/b.png">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/Navigation.css}" />
	<link rel="stylesheet" th:href="@{/css/Login.css}" />
</head>
<body class="auth-body">
	<nav th:replace="~{Navigation::navbar()}"></nav>

	<main class="auth-page">
		<section class="auth-shell">
			<div class="auth-brand">
				<p class="auth-kicker">Nuevo cliente</p>
				<h1>Crea tu usuario</h1>
				<p>Regístrate para comprar, guardar tus datos y usar FoodApp. El correo será tu usuario de ingreso.</p>
			</div>

			<div class="auth-card">
				<h2>Datos de la cuenta</h2>
				<p class="auth-subtitle">Completa el formulario para empezar.</p>
				<p class="auth-alert" th:if="${error}" th:text="${error}"></p>

				<form th:action="@{/register}" method="post" class="auth-form" th:object="${user}">
					<label for="uname">Nombre</label>
					<input id="uname" type="text" name="uname" th:value="*{uname}" placeholder="Tu nombre" required minlength="2" autocomplete="name">

					<label for="uemail">Correo electrónico</label>
					<input id="uemail" type="email" name="uemail" th:value="*{uemail}" placeholder="tucorreo@ejemplo.com" required autocomplete="email">

					<label for="unumber">Teléfono</label>
					<input id="unumber" type="tel" name="unumber" th:value="*{unumber}" placeholder="Ej. 70001234" required pattern="[0-9]{8,10}" inputmode="numeric">

					<label for="upassword">Contraseña</label>
					<div class="password-field">
						<input id="upassword" type="password" name="upassword" placeholder="Mínimo 4 caracteres" required minlength="4" autocomplete="new-password">
						<button type="button" class="toggle-password" data-target="upassword" aria-label="Mostrar contraseña">
							<i class="fa-solid fa-eye"></i>
						</button>
					</div>

					<label for="confirmPassword">Confirmar contraseña</label>
					<div class="password-field">
						<input id="confirmPassword" type="password" name="confirmPassword" placeholder="Repite tu contraseña" required minlength="4" autocomplete="new-password">
						<button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Mostrar contraseña">
							<i class="fa-solid fa-eye"></i>
						</button>
					</div>

					<button type="submit" class="auth-submit">Crear cuenta</button>
				</form>

				<p class="auth-switch">
					¿Ya tienes cuenta?
					<a th:href="@{/login}">Iniciar sesión</a>
				</p>
			</div>
		</section>
	</main>

	<script>
		document.querySelectorAll('.toggle-password').forEach(function (button) {
			button.addEventListener('click', function () {
				var input = document.getElementById(button.dataset.target);
				var icon = button.querySelector('i');
				if (input.type === 'password') {
					input.type = 'text';
					icon.classList.remove('fa-eye');
					icon.classList.add('fa-eye-slash');
				} else {
					input.type = 'password';
					icon.classList.remove('fa-eye-slash');
					icon.classList.add('fa-eye');
				}
			});
		});
	</script>
</body>
</html>
